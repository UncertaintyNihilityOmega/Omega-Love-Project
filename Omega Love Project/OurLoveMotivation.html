<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- keeps search engines from ever listing this page -->
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Uncertainty ♥ Tessa</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 90 C30 74 8 56 8 34 C8 20 18 11 29 11 C39 11 47 17 50 27 C53 17 61 11 71 11 C82 11 92 20 92 34 C92 56 70 74 50 90 Z' fill='%23ff5c8d'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== wholesome background layers ===== -->
  <div class="bg-gradient" aria-hidden="true"></div>
  <div class="bg-bokeh" aria-hidden="true"></div>
  <div class="floating-hearts" id="floatingHearts" aria-hidden="true"></div>

  <!-- shared gradient used by rainbow click-hearts -->
  <svg width="0" height="0" class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="rainbowGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%"   stop-color="#ff3b6b"/>
        <stop offset="20%"  stop-color="#ff9a3b"/>
        <stop offset="40%"  stop-color="#ffe23b"/>
        <stop offset="60%"  stop-color="#3bff9a"/>
        <stop offset="80%"  stop-color="#3bb8ff"/>
        <stop offset="100%" stop-color="#c13bff"/>
      </linearGradient>
      <!-- fill of the gigantic exploding heart -->
      <radialGradient id="giantGrad" cx="40%" cy="32%" r="80%">
        <stop offset="0%"   stop-color="#fff3f7"/>
        <stop offset="30%"  stop-color="#ff8fb8"/>
        <stop offset="70%"  stop-color="#ff3d86"/>
        <stop offset="100%" stop-color="#e0105f"/>
      </radialGradient>
    </defs>
  </svg>

  <main class="love-grid">

    <!-- ===== Partner 1 — lovely writings ===== -->
    <section class="panel words-panel" id="wordsPanel1">
      <header class="panel-header">
        <h2 class="partner-name" data-name="1">Uncertainty</h2>
        <span class="panel-subtitle">lovely words</span>
      </header>
      <div class="words-scroll" id="wordsScroll1">
        <div class="words-inner">
          <div class="quote-mark">“</div>
          <div class="words-text" id="wordsText1"></div>
        </div>
      </div>
      <div class="words-progress"><span id="wordsProgress1"></span></div>
      <p class="panel-hint">click to read another ♥</p>
    </section>

    <!-- ===== Partner 1 — photos ===== -->
    <section class="panel photo-panel" id="photoPanel1">
      <div class="photo-frame" id="photoFrame1"></div>
      <div class="photo-footer">
        <span class="photo-owner" data-name="1">Uncertainty</span>
        <span class="photo-counter" id="photoCounter1"></span>
      </div>
    </section>

    <!-- ===== the heart between us ===== -->
    <section class="heart-center" id="heartCenter">
      <div class="heart-wrap">
        <div class="heart-ripples" aria-hidden="true">
          <svg viewBox="0 0 100 100" class="ripple"><path d="M50 90 C30 74 8 56 8 34 C8 20 18 11 29 11 C39 11 47 17 50 27 C53 17 61 11 71 11 C82 11 92 20 92 34 C92 56 70 74 50 90 Z"/></svg>
          <svg viewBox="0 0 100 100" class="ripple"><path d="M50 90 C30 74 8 56 8 34 C8 20 18 11 29 11 C39 11 47 17 50 27 C53 17 61 11 71 11 C82 11 92 20 92 34 C92 56 70 74 50 90 Z"/></svg>
          <svg viewBox="0 0 100 100" class="ripple"><path d="M50 90 C30 74 8 56 8 34 C8 20 18 11 29 11 C39 11 47 17 50 27 C53 17 61 11 71 11 C82 11 92 20 92 34 C92 56 70 74 50 90 Z"/></svg>
        </div>
        <div class="sparkles" aria-hidden="true">
          <span>✦</span><span>✦</span><span>✦</span><span>✦</span>
          <span>✦</span><span>✦</span><span>✦</span><span>✦</span>
        </div>
        <div class="heart-beat" id="heartBeat" role="button" aria-label="Click the heart for a surprise">
          <svg class="big-heart" viewBox="0 0 100 100" aria-hidden="true">
            <defs>
              <radialGradient id="heartFill" cx="34%" cy="28%" r="85%">
                <stop offset="0%"   stop-color="#ffc2d4"/>
                <stop offset="38%"  stop-color="#ff6f9c"/>
                <stop offset="100%" stop-color="#d81b60"/>
              </radialGradient>
            </defs>
            <path d="M50 90 C30 74 8 56 8 34 C8 20 18 11 29 11 C39 11 47 17 50 27 C53 17 61 11 71 11 C82 11 92 20 92 34 C92 56 70 74 50 90 Z" fill="url(#heartFill)"/>
            <ellipse cx="30" cy="27" rx="9" ry="5.5" fill="#fff" opacity=".38" transform="rotate(-28 30 27)"/>
            <circle cx="22" cy="37" r="2.2" fill="#fff" opacity=".55"/>
          </svg>
          <!-- our names, in pink neon, inside the heart -->
          <div class="heart-names">
            <span class="hn-name" data-name="1">Uncertainty</span>
            <span class="hn-amp">&amp;</span>
            <span class="hn-name" data-name="2">Tessa</span>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== Partner 2 — photos ===== -->
    <section class="panel photo-panel" id="photoPanel2">
      <div class="photo-frame" id="photoFrame2"></div>
      <div class="photo-footer">
        <span class="photo-owner" data-name="2">Tessa</span>
        <span class="photo-counter" id="photoCounter2"></span>
      </div>
    </section>

    <!-- ===== Partner 2 — lovely writings ===== -->
    <section class="panel words-panel" id="wordsPanel2">
      <header class="panel-header">
        <h2 class="partner-name" data-name="2">Tessa</h2>
        <span class="panel-subtitle">lovely words</span>
      </header>
      <div class="words-scroll" id="wordsScroll2">
        <div class="words-inner">
          <div class="quote-mark">“</div>
          <div class="words-text" id="wordsText2"></div>
        </div>
      </div>
      <div class="words-progress"><span id="wordsProgress2"></span></div>
      <p class="panel-hint">click to read another ♥</p>
    </section>

  </main>

  <!-- click-hearts are drawn in here -->
  <div class="heart-effects" id="heartEffects" aria-hidden="true"></div>

  <script src="js/config.js"></script>
  <script src="js/loveWords.js"></script>
  <script src="js/images.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
